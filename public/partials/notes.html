<!-- Notes feature partial — loaded on first open into
     <section data-feature="notes"> (js/app/feature-host.js). The root element
     IS the feature card (x-data="notesCard", js/cards/notes-card.js); each list
     item is a noteItemCard sub-component. Anatomy: DESIGN.md → Feature-Anatomie.
     Patterns: DESIGN.md → Karte, Karten-Innenraum, Formulare, Icon-Button,
     Popover, Klappbare Sektion, Sortierbare Liste. -->

<div x-data="notesCard" @note-removed="removeNote($event.detail)">
<div class="card card--notes">
  <div class="card-header card-header--subline">
    <div class="card-header-titlebar">
      <h2 class="card-title" x-text="t('nav.notes')"></h2>
    </div>
    <div class="card-header-aside">
      <span class="badge badge-neutral tabular-nums" x-text="notes.length"></span>
    </div>
  </div>

  <div class="card-form-grid">
    <div class="card-form-row">
      <label class="card-form-label" id="notebook-label" x-text="t('notebook.label')"></label>
      <div class="row">
        <div id="notebook-select" aria-labelledby="notebook-label"
             x-data="combobox()" x-modelable="value" x-model="currentNotebookId"
             x-effect="options = notebooks.map((nb) => ({ value: nb.id, label: nb.name }))"
             @combobox-change="selectNotebook($event.detail)"></div>
        <button type="button" class="icon-btn tip--end" x-ref="notebookAddBtn" @click="openNotebookForm()"
                :aria-expanded="notebookFormOpen" :aria-label="t('notebook.add')" :data-tip="t('notebook.add')">
          <svg class="icon" aria-hidden="true"><use href="/icons.svg#folder-plus"/></svg>
        </button>
      </div>
      <!-- Popover (DESIGN.md → Popover): x-anchor pins it to the button, x-trap
           keeps Tab inside and returns focus to the button on close. -->
      <div class="popover" x-show="notebookFormOpen" x-cloak role="dialog" :aria-label="t('notebook.add')"
           x-anchor.bottom-end.offset.4="$refs.notebookAddBtn" x-trap="notebookFormOpen"
           @keydown.escape.stop="notebookFormOpen = false" @click.outside="notebookFormOpen = false">
        <form class="row" @submit.prevent="createNotebook()">
          <input type="text" x-model="newNotebookName" :placeholder="t('notebook.namePlaceholder')"
                 :aria-label="t('notebook.namePlaceholder')">
          <button type="submit" class="primary" :disabled="!newNotebookName.trim()">
            <svg class="icon" aria-hidden="true"><use href="/icons.svg#check"/></svg>
            <span x-text="t('notebook.create')"></span>
          </button>
        </form>
      </div>
    </div>
    <div class="card-form-row">
      <label class="card-form-label" for="new-note-title" x-text="t('notes.newLabel')"></label>
      <div class="row">
        <input id="new-note-title" type="text" x-model="newNoteTitle"
               :placeholder="t('notes.newPlaceholder')" @keydown.enter="addNote()">
        <button type="button" class="primary" @click="addNote()">
          <svg class="icon" aria-hidden="true"><use href="/icons.svg#plus"/></svg>
          <span x-text="t('notes.add')"></span>
        </button>
      </div>
    </div>
  </div>

  <div class="card-empty" x-show="!notes.length">
    <p class="card-empty-text" x-text="t('notes.empty')"></p>
  </div>
  <p class="card-status card-status--error" x-show="reorderError" x-text="reorderError"></p>

  <!-- Collapsible section (DESIGN.md → Klappbare Sektion); Chart.js loads on first open. -->
  <div class="card-section">
    <button type="button" class="collapsible-toggle" @click="overviewOpen = !overviewOpen"
            :aria-expanded="overviewOpen" aria-controls="notes-overview">
      <svg class="icon collapsible-chevron" :class="{ 'is-open': overviewOpen }" aria-hidden="true"><use href="/icons.svg#chevron-right"/></svg>
      <span x-text="t('notes.overview')"></span>
    </button>
    <div id="notes-overview" x-show="overviewOpen" x-collapse x-cloak>
      <div class="notes-chart">
        <canvas x-ref="notesChart" role="img" :aria-label="t('notes.chartLabel')"></canvas>
      </div>
    </div>
  </div>
</div>

<!-- Sortable list (DESIGN.md → Sortierbare Liste): the x-for items are the
     draggables, dragged by .note-drag-handle only. -->
<div class="note-list" x-ref="noteList">
<template x-for="note in notes" :key="note.id">
  <article class="card card--notes note-card" x-data="noteItemCard(note)">
    <template x-if="!editing">
      <div>
        <div class="card-header card-header--subline">
          <div class="card-header-titlebar">
            <h3 class="card-title" x-text="note.title"></h3>
            <div class="card-subline">
              <span class="card-timestamp">
                <span x-text="t('notes.updated')"></span>: <span x-text="fmt(note.updated_at)"></span>
              </span>
              <span class="spinner" x-show="busy" aria-hidden="true"></span>
            </div>
          </div>
          <div class="card-actions">
            <button type="button" class="icon-btn icon-btn--ghost note-drag-handle" x-show="notes.length > 1"
                    :aria-label="t('notes.reorder')" :data-tip="t('notes.reorder')">
              <svg class="icon" aria-hidden="true"><use href="/icons.svg#grip-vertical"/></svg>
            </button>
            <button type="button" class="icon-btn icon-btn--ghost" @click="startEdit()" :disabled="busy"
                    :aria-label="t('notes.edit')" :data-tip="t('notes.edit')">
              <svg class="icon" aria-hidden="true"><use href="/icons.svg#pencil"/></svg>
            </button>
            <button type="button" class="icon-btn icon-btn--ghost" @click="runStats()" :disabled="busy"
                    :aria-label="t('notes.runStats')" :data-tip="t('notes.runStats')">
              <svg class="icon" aria-hidden="true"><use href="/icons.svg#activity"/></svg>
            </button>
            <span class="action-sep" aria-hidden="true"></span>
            <button type="button" class="icon-btn icon-btn--ghost icon-btn--danger tip--end" @click="remove()" :disabled="busy"
                    :aria-label="t('notes.delete')" :data-tip="t('notes.delete')">
              <svg class="icon" aria-hidden="true"><use href="/icons.svg#trash"/></svg>
            </button>
          </div>
        </div>
        <!-- x-html sink: bodyHtml is escaped in note-card.js (escape invariant). -->
        <!-- Clamped until expanded; x-resize measures whether it clips (DESIGN.md → Alpine-Plugins). -->
        <div class="note-body" :class="{ 'note-body--clamped': !bodyExpanded }" x-html="bodyHtml"
             x-resize="measureBody($el)"></div>
        <button type="button" class="btn-compact note-body-toggle" x-show="bodyOverflows" @click="bodyExpanded = !bodyExpanded"
                :aria-expanded="bodyExpanded" x-text="bodyExpanded ? t('notes.showLess') : t('notes.showMore')"></button>
        <p class="note-stats" x-show="stats">
          <span class="badge badge-ok tabular-nums" x-text="stats ? t('notes.stats', stats) : ''"></span>
        </p>
      </div>
    </template>

    <template x-if="editing">
      <div>
        <div class="card-section form-stack">
          <input type="text" x-model="draftTitle" :placeholder="t('notes.titlePlaceholder')"
                 :aria-label="t('notes.titlePlaceholder')">
          <textarea class="card-form-textarea" rows="6" x-model="draftBody"
                    :placeholder="t('notes.bodyPlaceholder')" :aria-label="t('notes.bodyPlaceholder')"></textarea>
        </div>
        <div class="card-section row note-edit-actions">
          <button type="button" @click="editing = false" x-text="t('notes.cancel')"></button>
          <button type="button" class="primary" @click="save()" :disabled="busy">
            <svg class="icon" aria-hidden="true"><use href="/icons.svg#check"/></svg>
            <span x-text="t('notes.save')"></span>
          </button>
        </div>
      </div>
    </template>
  </article>
</template>
</div>
</div>
