<!doctype html>
<html lang="de">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="color-scheme" content="light dark">
  <title>Login — vibe-template</title>
  <meta name="theme-color" content="#f6f7f9" media="(prefers-color-scheme: light)">
  <meta name="theme-color" content="#0e0f12" media="(prefers-color-scheme: dark)">
  <link rel="icon" href="/icon.svg" type="image/svg+xml">
  <!-- Classic, synchronous: the theme chosen in the app applies here too. -->
  <script src="/js/theme-boot.js"></script>
  <!-- Public page: only the files it needs, same cascade order as index.html. -->
  <link rel="stylesheet" href="/css/tokens.css">
  <link rel="stylesheet" href="/css/card-accents.css">
  <link rel="stylesheet" href="/css/layout/base.css">
  <link rel="stylesheet" href="/css/layout/layout-base.css">
  <link rel="stylesheet" href="/css/components/card-form/card-shell.css">
  <link rel="stylesheet" href="/css/components/card-form/card-blocks.css">
  <link rel="stylesheet" href="/css/components/card-form/form-elements.css">
  <link rel="stylesheet" href="/css/components/buttons-badges.css">
</head>
<body>
  <!-- Login page (docs/auth.md): an Alpine page of its own (js/login.js), all
       text via t(). Offers what /auth/methods reports: password login (local
       users + the .env admin), OIDC, the dev bypass; and the forced change of
       an initial password. -->
  <main class="login-shell" x-data="loginPage" x-cloak>
    <div class="card card--nav">
      <div class="card-header">
        <h1 class="site-title">
          <img src="/icon.svg" alt="" class="site-logo" width="36" height="36">
          <span x-text="t('app.title')"></span>
        </h1>
        <p class="login-lead" x-text="t('login.lead')"></p>
      </div>

      <!-- Dev bypass: only when LOCAL_DEV_MODE=1 on the server. -->
      <form class="card-section" method="POST" action="/auth/dev-login" x-show="methods.devMode">
        <button class="primary login-btn" type="submit" x-text="t('login.dev')"></button>
      </form>

      <!-- Password login: local users, or only the admin when AUTH_METHOD=oidc. -->
      <form class="card-section form-stack" x-show="mode === 'login' && showPasswordForm" @submit.prevent="login()" novalidate>
        <h2 class="card-section-title" x-text="methods.method === 'local' ? t('login.title') : t('login.adminTitle')"></h2>
        <label for="login-email" x-text="t('login.email')"></label>
        <input id="login-email" type="email" autocomplete="username" required x-model="email">
        <label for="login-password" x-text="t('login.password')"></label>
        <input id="login-password" type="password" autocomplete="current-password" required x-model="password">
        <p class="card-form-error" x-show="error" x-text="error" role="alert"></p>
        <button class="primary login-btn" type="submit" :disabled="busy || !email || !password" x-text="t('login.submit')"></button>
      </form>

      <!-- Initial password → the user sets their own before a session opens. -->
      <form class="card-section form-stack" x-show="mode === 'change'" @submit.prevent="changePassword()" novalidate>
        <h2 class="card-section-title" x-text="t('login.changeTitle')"></h2>
        <p class="card-hint" x-text="t('login.changeHint', { min: minLength })"></p>
        <label for="login-new" x-text="t('login.newPassword')"></label>
        <input id="login-new" type="password" autocomplete="new-password" required x-model="newPassword">
        <label for="login-repeat" x-text="t('login.repeatPassword')"></label>
        <input id="login-repeat" type="password" autocomplete="new-password" required x-model="repeatPassword">
        <p class="card-form-error" x-show="error" x-text="error" role="alert"></p>
        <button class="primary login-btn" type="submit" :disabled="busy || !newPassword" x-text="t('login.changeSubmit')"></button>
      </form>

      <form class="card-section card-section--tight" method="GET" action="/auth/login" x-show="mode === 'login' && methods.method === 'oidc'">
        <button class="login-btn" type="submit" x-text="t('login.oidc')"></button>
      </form>
    </div>
  </main>
  <script type="module" src="/js/login.js"></script>
</body>
</html>
