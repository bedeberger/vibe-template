name: CI

# The test gate. Runs on every PR and every push to main. A green run on main
# is what triggers the deploy (deploy.yml, `workflow_run`).
#
# WHERE it runs: GitHub-hosted by default. With the repository variable
# SELF_HOSTED_CI=true it runs on the LXC runners (scripts/prepare-lxc.sh) —
# warm node_modules + browser cache, same Node binary as prod. FORK PRs always
# stay on GitHub-hosted: foreign code never runs on the prod box.
#
# ONE job, all suites in sequence: one checkout + one `npm ci` + one browser
# install. Splitting into jobs would pay the setup N times for a suite that
# runs in well under a minute.
on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

# A newer push to the same PR makes the running check worthless → cancel it.
# On main never cancel: every commit that may deploy gets its full run.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  test:
    name: Checks + Unit + Integration + Playwright
    runs-on: >-
      ${{ vars.SELF_HOSTED_CI == 'true'
      && (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository)
      && fromJSON(format('["self-hosted","linux","{0}"]', vars.APP_NAME || 'vibe-template'))
      || 'ubuntu-latest' }}
    timeout-minutes: 15
    env:
      CI: "true"
    steps:
      - uses: actions/checkout@v4

      # Node major from .nvmrc — the same one the LXC runs (scripts/prepare-lxc.sh).
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm

      - run: npm ci --prefer-offline --no-audit --no-fund

      # Only high/critical block — moderate/low would be too noisy for a gate.
      - name: Dependency audit (high+)
        run: npm audit --audit-level=high --omit=dev

      # Secret scan of the working tree (no history walk: fast, deterministic).
      - name: Secret scan (gitleaks)
        env:
          GITLEAKS_VERSION: "8.21.2"
        run: |
          set -euo pipefail
          url="https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          curl -fsSL --retry 5 --retry-all-errors --retry-delay 3 "$url" | tar -xz -C "$RUNNER_TEMP" gitleaks
          "$RUNNER_TEMP/gitleaks" detect --no-git --redact --no-banner --source .

      # Migration gates first: a broken chain makes every later failure noise.
      - name: Migration gates (lock + squash drift)
        run: |
          node scripts/migrations-lock.js
          npm run squash:check

      - run: npm run test:unit
      - run: npm run test:integration

      # Hosted: browser + OS libs. Self-hosted: browser only — the runner has no
      # sudo for apt; prepare-lxc.sh installed the OS libs once as root.
      - name: Install Playwright browser
        run: |
          if [ "${{ runner.environment }}" = "github-hosted" ]; then
            npx playwright install --with-deps chromium
          else
            npx playwright install chromium
          fi

      - run: npm run test:e2e
      - run: npm run test:e2e-app

      - name: Upload Playwright report on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: |
            playwright-report/
            test-results/
          retention-days: 7
