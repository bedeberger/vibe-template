name: CI

# The test gate. Runs on every PR and every push to main, on a GitHub-hosted
# runner (throwaway VM — foreign PR code never touches the prod LXC). A green
# run on main is what triggers the deploy (deploy.yml, `workflow_run`).
#
# ONE job, all suites in sequence: one checkout + one `npm ci` + one browser
# install. Splitting into jobs would pay the setup N times for a suite that
# runs in well under a minute.
on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

# A newer push to the same PR makes the running check worthless → cancel it.
# On main never cancel: every commit that may deploy gets its full run.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  test:
    name: Checks + Unit + Integration + Playwright
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      CI: "true"
    steps:
      - uses: actions/checkout@v4

      # Node major from .nvmrc — the same one the LXC runs (scripts/prepare-lxc.sh).
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm

      - run: npm ci --prefer-offline --no-audit --no-fund

      # Only high/critical block — moderate/low would be too noisy for a gate.
      - name: Dependency audit (high+)
        run: npm audit --audit-level=high --omit=dev

      # Secret scan of the working tree (no history walk: fast, deterministic).
      - name: Secret scan (gitleaks)
        env:
          GITLEAKS_VERSION: "8.21.2"
        run: |
          set -euo pipefail
          url="https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          curl -fsSL --retry 5 --retry-all-errors --retry-delay 3 "$url" | tar -xz -C "$RUNNER_TEMP" gitleaks
          "$RUNNER_TEMP/gitleaks" detect --no-git --redact --no-banner --source .

      # Migration gates first: a broken chain makes every later failure noise.
      - name: Migration gates (lock + squash drift)
        run: |
          node scripts/migrations-lock.js
          npm run squash:check

      - run: npm run test:unit
      - run: npm run test:integration

      - name: Install Playwright browser
        run: npx playwright install --with-deps chromium

      - run: npm run test:e2e
      - run: npm run test:smoke

      - name: Upload Playwright report on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: |
            playwright-report/
            test-results/
          retention-days: 7
